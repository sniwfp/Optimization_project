[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochopt-bench"
version = "0.1.0"
description = "Reproducible benchmark of stochastic optimization methods for classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
vision = ["torchvision>=0.17"]

[project.scripts]
stochopt-bench = "stochopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
